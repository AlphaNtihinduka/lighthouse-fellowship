# Lighthouse Fellowship on the shared SponsorDirect VPS (docs/PLAN.md §3).
# Own project name, own network, own Postgres: nothing here touches SponsorDirect.
# The deploy workflow copies this file to /opt/lighthouse-fellowship on every deploy,
# so edit it here, never on the VPS. Values come from .env next to it (.env.example).
#
# Never run `docker compose down -v`: it deletes the Postgres volume, the only copy
# of the notes.
name: lighthouse-fellowship

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lighthouse-network
    # Not published on any host port.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # The deploy pins BACKEND_IMAGE to the commit SHA; locally `docker compose up --build`
    # builds from ./backend instead.
    image: ${BACKEND_IMAGE:-alphadevug/lighthouse-fellowship-backend:latest}
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8099:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?JWT_ADMIN_SECRET is required}
      JWT_ADMIN_EXPIRATION_MS: ${JWT_ADMIN_EXPIRATION_MS:-28800000}
      CLOUDINARY_URL: ${CLOUDINARY_URL:?CLOUDINARY_URL is required}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_DISPLAY_NAME: ${ADMIN_SEED_DISPLAY_NAME:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_TRUST_FORWARDED_HEADERS: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:-false}
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lighthouse-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lighthouse-network:

volumes:
  postgres_data:
