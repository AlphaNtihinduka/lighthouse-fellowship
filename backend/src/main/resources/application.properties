spring.application.name=lighthouse-fellowship-backend
server.port=${SERVER_PORT:8081}

# --- Database (PostgreSQL 17). In Docker the host is the "postgres" service, never localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lighthouse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lighthouse}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Small pool: the VPS is shared with SponsorDirect.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Flyway owns the schema; Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Unknown JSON fields in a request are a 400, not silently dropped. This is part of
# the sermon note content validation (ADR 0002).
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Admin auth. No fallback for the secret: a missing value fails startup.
app.jwt.admin-secret=${JWT_ADMIN_SECRET}
# 8 hours
app.jwt.admin-expiration-ms=${JWT_ADMIN_EXPIRATION_MS:28800000}

# First admin, created once if missing (AdminSeeder). Empty = no seeding.
app.admin-seed.email=${ADMIN_SEED_EMAIL:}
app.admin-seed.password=${ADMIN_SEED_PASSWORD:}
app.admin-seed.display-name=${ADMIN_SEED_DISPLAY_NAME:}

# Dashboard origins allowed by CORS, comma separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Only true once the host Nginx sets X-Forwarded-For (phase 6). Before that,
# clients could forge the header to dodge the per-IP limits.
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

# --- Cover images (Cloudinary). No fallback: a missing value fails startup.
cloudinary.url=${CLOUDINARY_URL}
app.cloudinary.cover-folder=${CLOUDINARY_COVER_FOLDER:lighthouse-fellowship/covers}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Tomcat reads up to this much of a too-large upload so it can answer 413 instead of
# resetting the connection (its default is 2MB). Bigger bodies are still cut off.
server.tomcat.max-swallow-size=20MB

# --- Observability. Only health is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [%X{requestId:-}]
