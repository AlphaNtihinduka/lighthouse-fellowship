<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F4C542" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F4C542" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" x2="1">
      <stop offset="0" stop-color="#A51F1F"/>
      <stop offset="0.45" stop-color="#C62828"/>
      <stop offset="1" stop-color="#8E1B1B"/>
    </linearGradient>
  </defs>
  <!-- beams -->
  <polygon points="540,300 1024,190 1024,410" fill="url(#beam)"/>
  <polygon points="484,300 0,190 0,410" fill="url(#beam)"/>
  <!-- cap and spire -->
  <rect x="507" y="168" width="10" height="44" fill="#1F2A4A"/>
  <circle cx="512" cy="166" r="10" fill="#1F2A4A"/>
  <path d="M452 250 Q512 196 572 250 Z" fill="#1F2A4A"/>
  <!-- lantern room -->
  <rect x="462" y="250" width="100" height="78" rx="6" fill="#E9E4D8" stroke="#1F2A4A" stroke-width="8"/>
  <rect x="490" y="266" width="44" height="46" rx="4" fill="#F4C542"/>
  <!-- gallery -->
  <rect x="430" y="328" width="164" height="22" rx="4" fill="#1F2A4A"/>
  <!-- tower -->
  <polygon points="452,350 572,350 622,812 402,812" fill="url(#tower)"/>
  <!-- windows -->
  <rect x="494" y="420" width="36" height="58" rx="10" fill="#FBF8F1" stroke="#1F2A4A" stroke-width="6"/>
  <rect x="494" y="550" width="36" height="58" rx="10" fill="#FBF8F1" stroke="#1F2A4A" stroke-width="6"/>
  <rect x="494" y="680" width="36" height="58" rx="10" fill="#FBF8F1" stroke="#1F2A4A" stroke-width="6"/>
  <!-- base -->
  <rect x="372" y="812" width="280" height="34" rx="4" fill="#6B6E78"/>
  <rect x="340" y="846" width="344" height="30" rx="4" fill="#9A9DA6"/>
</svg>
