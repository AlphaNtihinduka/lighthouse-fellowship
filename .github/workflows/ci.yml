name: CI

# Builds and tests all three parts on every push and PR to main.
# Deploys are a separate workflow (deploy.yml) that runs after this one passes on main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # The wrapper loses its executable bit when committed from Windows.
      - run: chmod +x mvnw
      # Integration tests start PostgreSQL 17 with Testcontainers (Docker is on the runner).
      - run: ./mvnw -B verify
      - name: Print test reports
        if: failure()
        run: find target/surefire-reports -name "*.txt" -exec cat {} \;

  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
